<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>写字板 · 手机笔锋版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; position: fixed;
    width: 100%; top: 0; left: 0; overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff; color: #333;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  #board {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: crosshair;
  }

  /* 重新排版的工具栏：固定宽度，自动换行/铺满，不隐藏按钮 */
  .toolbar {
    position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; /* 分为上下两行 */
    padding: 10px 12px; width: calc(100vw - 20px); max-width: 500px;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,.1);
    border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.15);
    z-index: 10;
  }

  .row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4px;}

  .swatches { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px;}
  .swatches::-webkit-scrollbar { display: none; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0;
    flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
  }
  .swatch.active { transform: scale(1.1); box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1a1a1a; }

  .size-wrap { display: flex; align-items: center; gap: 6px; flex: 1; padding: 0 10px; }
  .size-label { font-size: 12px; color: #888; white-space: nowrap; }
  input[type=range] { flex: 1; -webkit-appearance: none; height: 20px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(0,0,0,.15); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px;
    border-radius: 50%; background: #1a1a1a; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

  .btn {
    flex: 1; height: 36px; border: none; border-radius: 8px; background: #f0f0f0;
    font-size: 13px; font-weight: 500; color: #333; transition: all .1s;
  }
  .btn.active { background: #1a1a1a; color: #fff; }
  .btn.danger { color: #e5484d; background: #ffebe9; }

  .hint {
    position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
    font-size: 13px; color: #9a9a9a; pointer-events: none; transition: opacity .5s; z-index: 5;
    background: rgba(255,255,255,.8); padding: 6px 16px; border-radius: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .hint.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="board"></canvas>
<div class="hint" id="hint">手指书写，快慢决定粗细</div>

<!-- 重新设计的工具栏，分两行 -->
<div class="toolbar">
  <div class="row">
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="row">
    <div class="size-wrap">
      <span class="size-label">粗细</span>
      <input type="range" id="size" min="1" max="30" step="1" value="8">
    </div>
  </div>
  <div class="row">
    <button class="btn active" id="penBtn">笔</button>
    <button class="btn" id="eraserBtn">橡皮</button>
    <button class="btn" id="undoBtn">撤销</button>
    <button class="btn danger" id="clearBtn">清空</button>
    <button class="btn" id="saveBtn">保存</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  const state = { color: '#1a1a1a', size: 8, tool: 'pen' };
  let strokes = [];
  let currentStroke = null;
  let drawing = false;
  let activePointerId = null;
  const activeTouches = new Set();

  function resize() {
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2.5));
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function getPoint(e) {
    const r = canvas.getBoundingClientRect();
    // 手机端大部分没有真实压感，统一走速度算法
    const pressure = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : null;
    return { x: e.clientX - r.left, y: e.clientY - r.top, pressure };
  }

  function renderStroke(s) {
    const pts = s.points;
    if (!pts.length) return;
    ctx.save();
    if (s.eraser) ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (pts.length === 1) {
      const p = pts[0];
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(p.w * 0.5, 0.5), 0, Math.PI * 2);
      ctx.fill();
      s.drawn = 1; ctx.restore(); return;
    }

    let i = Math.max(1, s.drawn || 1);
    for (; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      ctx.beginPath();
      ctx.lineWidth = Math.max(0.5, (a.w + b.w) * 0.5);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    s.drawn = pts.length;
    ctx.restore();
  }

  function redraw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    for (const s of strokes) { s.drawn = 0; renderStroke(s); }
  }

  // 核心优化：处理手机浏览器丢帧问题，让笔锋更明显
  function addPoint(s, x, y, pressure, t) {
    const last = s.points[s.points.length - 1];
    const dx = x - last.x, dy = y - last.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.5) return;

    const dt = Math.max(t - s.lastT, 1);
    s.lastT = t;
    const speed = dist / dt;
    s.speed = s.speed * 0.5 + speed * 0.5; // 更灵敏的速度捕捉

    const base = s.size;
    let target;

    if (pressure !== null) {
      const p = Math.max(0.1, Math.min(1, pressure));
      target = base * (0.4 + 1.2 * p);
    } else {
      // 手机环境优化：如果划得特别快，直接给极细的线条（制造锋尖）
      // 放宽速度阈值，让慢速写的时候粗，快速滑动时骤细
      const k = Math.min(s.speed / 1.5, 1);
      target = base * (1 - 0.75 * k); 
    }

    target = Math.max(target, base * 0.1);
    target = Math.min(target, base * 1.5);

    // 距离过大时插值平滑
    const step = 2;
    const n = Math.max(1, Math.ceil(dist / step));
    const startW = last.w;
    const endW = startW + (target - startW) * 0.5;

    for (let i = 1; i <= n; i++) {
      const tt = i / n;
      s.points.push({ x: last.x + dx * tt, y: last.y + dy * tt, w: startW + (endW - startW) * tt });
    }
  }

  function finishStroke(s) {
    const pts = s.points;
    if (pts.length >= 2) {
      const a = pts[pts.length - 2], b = pts[pts.length - 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      pts.push({ x: b.x + (dx / len) * 1.5, y: b.y + (dy / len) * 1.5, w: 0.5 }); // 强制出一个尖
    }
    renderStroke(s);
  }

  function startNewStroke(e) {
    hint.classList.add('hide');
    const p = getPoint(e);
    const w0 = p.pressure !== null ? state.size * (0.4 + p.pressure) : state.size * 0.8;

    drawing = true;
    activePointerId = e.pointerId;
    currentStroke = {
      points: [{ x: p.x, y: p.y, w: w0 }],
      color: state.color, size: state.size,
      eraser: state.tool === 'eraser',
      drawn: 0, lastT: performance.now(), speed: 0,
    };
    strokes.push(currentStroke);
    renderStroke(currentStroke);
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }

  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // 只对 canvas 阻止默认行为
    if (e.target === canvas && e.cancelable) e.preventDefault();

    activeTouches.add(e.pointerId);
    if (activeTouches.size > 1) {
      if (drawing) { drawing = false; if (currentStroke) finishStroke(currentStroke); }
      return;
    }
    startNewStroke(e);
  }

  function onPointerMove(e) {
    if (!drawing || !currentStroke || e.pointerId !== activePointerId) return;
    if (e.target === canvas && e.cancelable) e.preventDefault();

    // 读取合并事件，解决手机浏览器丢帧导致的线条不平滑
    let evts = null;
    if (typeof e.getCoalescedEvents === 'function') {
      try { evts = e.getCoalescedEvents(); } catch (_) {}
    }

    if (evts && evts.length) {
      for (const ev of evts) {
        const p = getPoint(ev);
        addPoint(currentStroke, p.x, p.y, p.pressure, performance.now());
      }
    } else {
      const p = getPoint(e);
      addPoint(currentStroke, p.x, p.y, p.pressure, performance.now());
    }
    renderStroke(currentStroke);
  }

  function onPointerUp(e) {
    activeTouches.delete(e.pointerId);
    if (e.pointerId !== activePointerId) return;
    drawing = false;
    if (currentStroke) { finishStroke(currentStroke); currentStroke = null; }
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  // 关键修复：只阻止画布上的触摸滚动，不阻止工具栏的滑动
  document.addEventListener('touchmove', (e) => {
    if (e.target === canvas && e.cancelable) e.preventDefault();
  }, { passive: false });

  document.addEventListener('gesturestart', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

  // 工具栏事件
  const COLORS = ['#1a1a1a', '#5c5c5c', '#e5484d', '#f5a524', '#30a46c', '#0090ff', '#8e4ec6', '#ff5c8a'];
  const swatchBox = document.getElementById('swatches');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = c;
    b.onclick = () => {
      state.color = c; state.tool = 'pen'; syncTool();
      document.querySelectorAll('.swatch').forEach(el => el.classList.remove('active'));
      b.classList.add('active');
    };
    swatchBox.appendChild(b);
  });

  document.getElementById('size').oninput = (e) => state.size = Number(e.target.value);

  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  function syncTool() {
    penBtn.classList.toggle('active', state.tool === 'pen');
    eraserBtn.classList.toggle('active', state.tool === 'eraser');
  }
  penBtn.onclick = () => { state.tool = 'pen'; syncTool(); };
  eraserBtn.onclick = () => { state.tool = 'eraser'; syncTool(); };

  document.getElementById('undoBtn').onclick = () => { if (strokes.length) { strokes.pop(); redraw(); } };
  document.getElementById('clearBtn').onclick = () => { if (strokes.length) { strokes = []; redraw(); } };
  document.getElementById('saveBtn').onclick = () => {
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width; tmp.height = canvas.height;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = '#ffffff'; tctx.fillRect(0, 0, tmp.width, tmp.height);
    tctx.drawImage(canvas, 0, 0);
    const a = document.createElement('a');
    a.download = `手写_${Date.now()}.png`;
    a.href = tmp.toDataURL('image/png');
    a.click();
  };

  window.addEventListener('resize', () => { clearTimeout(window._rt); window._rt = setTimeout(resize, 150); });
  requestAnimationFrame(() => { resize(); syncTool(); });
})();
</script>
</body>
</html>
